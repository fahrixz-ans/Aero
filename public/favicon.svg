<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="aeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="#0B0E14"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
  
  <!-- AeroAPK Logo Symbol (Shield + Rocket / Download Vector) -->
  <g transform="translate(106, 96)">
    <!-- Shield Outer -->
    <path d="M150 20 L270 70 C270 190 190 270 150 300 C110 270 30 190 30 70 Z" fill="url(#aeroGrad)"/>
    
    <!-- Inner Download Arrow / Aerodynamic Wings -->
    <path d="M150 75 L150 195 M105 155 L150 200 L195 155" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Sparkle dot -->
    <circle cx="150" cy="245" r="12" fill="#FFFFFF"/>
  </g>
</svg>
